<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Firma de correo MASSA</title>
</head>
<body style="margin:0;padding:24px;background:#f4f4f4;">
<!--
  Firma MASSA.
  Para instalarla: abre este HTML en un navegador, selecciona la firma renderizada,
  cópiala y pégala en la configuración de firma de tu correo.
  Si tu cliente de correo no conserva las imágenes locales, aloja massa-logo.png y
  pizza-closeup.png en una URL pública y reemplaza las rutas relativas por esas URLs.
-->
<table role="presentation" cellpadding="0" cellspacing="0" border="0"
       width="640" style="width:640px;max-width:100%;border-collapse:collapse;background:#e78cb5;">
  <tr>
    <td style="padding:22px 20px 20px 24px;vertical-align:middle;width:190px;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
        <tr>
          <td align="center" valign="middle"
              style="background:#24569b;padding:18px 10px;border-radius:2px;">
            <img src="massa-logo.png" width="160" alt="MASSA"
                 style="display:block;width:160px;max-width:100%;height:auto;border:0;">
          </td>
        </tr>
        <tr>
          <td align="center"
              style="padding-top:9px;font-family:Arial,Helvetica,sans-serif;font-size:10px;letter-spacing:3px;font-weight:bold;color:#24569b;">
            PIZZA &amp; CAFÉ
          </td>
        </tr>
      </table>
    </td>
    <td style="width:1px;background:#24569b;font-size:0;line-height:0;">&nbsp;</td>
    <td style="padding:20px 18px 18px 20px;vertical-align:middle;width:205px;">
      <div style="font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.25;font-weight:bold;color:#24569b;">
        MASSA PIZZA &amp; CAFÉ
      </div>
      <div style="font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:1.4;color:#24569b;padding-top:5px;">
        Happiness is coming.
      </div>
      <div style="height:13px;line-height:13px;font-size:13px;">&nbsp;</div>

      <!-- Hand-drawn-style icon links -->
      <table role="presentation" cellpadding="0" cellspacing="0" border="0"
             style="border-collapse:collapse;">
        <tr>
          <td width="27" valign="middle" style="padding:4px 8px 4px 0;">
            <!-- Instagram: loose hand-drawn outline -->
            <svg width="22" height="22" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="display:block">
              <path d="M7 3.7C4.9 3.9 3.8 5.2 3.7 7.3v9.2c.1 2.1 1.4 3.5 3.6 3.7h9.1c2.2-.2 3.5-1.5 3.7-3.7V7.4c-.2-2.2-1.5-3.5-3.7-3.7H7Z" fill="none" stroke="#24569b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M12 8.1a3.9 3.9 0 1 0 0 7.8 3.9 3.9 0 0 0 0-7.8Z" fill="none" stroke="#24569b" stroke-width="1.8"/>
              <path d="M17.2 6.8h.1" stroke="#24569b" stroke-width="2.5" stroke-linecap="round"/>
            </svg>
          </td>
          <td valign="middle" style="padding:4px 0;">
            <a href="https://www.instagram.com/massapizzacafe/" style="font-family:Arial,Helvetica,sans-serif;font-size:12px;color:#24569b;text-decoration:none;">Instagram</a>
          </td>
        </tr>
        <tr>
          <td width="27" valign="middle" style="padding:4px 8px 4px 0;">
            <!-- TikTok: hand-drawn note -->
            <svg width="22" height="22" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="display:block">
              <path d="M14 3.2v11.1a4.1 4.1 0 1 1-3.1-4" fill="none" stroke="#24569b" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M14 3.4c.5 2.5 2.1 4.1 4.7 4.6" fill="none" stroke="#24569b" stroke-width="1.9" stroke-linecap="round"/>
            </svg>
          </td>
          <td valign="middle" style="padding:4px 0;">
            <a href="https://www.tiktok.com/@massapizzacafe" style="font-family:Arial,Helvetica,sans-serif;font-size:12px;color:#24569b;text-decoration:none;">TikTok</a>
          </td>
        </tr>
        <tr>
          <td width="27" valign="middle" style="padding:4px 8px 4px 0;">
            <!-- Website: hand-drawn globe -->
            <svg width="22" height="22" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="display:block">
              <path d="M12 3.2a8.8 8.8 0 1 0 0 17.6 8.8 8.8 0 0 0 0-17.6Z" fill="none" stroke="#24569b" stroke-width="1.7"/>
              <path d="M3.7 9h16.6M3.7 15h16.6M12 3.3c2.4 2.4 3.2 5.2 3.2 8.7s-.8 6.3-3.2 8.7c-2.4-2.4-3.2-5.2-3.2-8.7s.8-6.3 3.2-8.7Z" fill="none" stroke="#24569b" stroke-width="1.35" stroke-linecap="round"/>
            </svg>
          </td>
          <td valign="middle" style="padding:4px 0;">
            <a href="https://www.massapizzacafe.com/" style="font-family:Arial,Helvetica,sans-serif;font-size:12px;color:#24569b;text-decoration:none;">Página web</a>
          </td>
        </tr>
        <tr>
          <td width="27" valign="middle" style="padding:4px 8px 4px 0;">
            <!-- Email: imperfect hand-drawn envelope -->
            <svg width="22" height="22" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="display:block">
              <path d="M3.5 6.1c.1-.8.7-1.2 1.5-1.2h14c.9 0 1.5.5 1.5 1.4v11.3c0 .9-.6 1.5-1.5 1.5H5c-.9 0-1.5-.6-1.5-1.5V6.1Z" fill="none" stroke="#24569b" stroke-width="1.7" stroke-linejoin="round"/>
              <path d="m4.1 6.4 7.8 6.1 8-6.1" fill="none" stroke="#24569b" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </td>
          <td valign="middle" style="padding:4px 0;">
            <a href="mailto:hola@massapizzacafe.com" style="font-family:Arial,Helvetica,sans-serif;font-size:12px;color:#24569b;text-decoration:none;">hola@massapizzacafe.com</a>
          </td>
        </tr>
      </table>
    </td>
    <td style="width:224px;vertical-align:middle;padding:0;">
      <img src="pizza-closeup.png" width="224" height="210" alt="Pizza MASSA"
           style="display:block;width:224px;height:210px;object-fit:cover;border:0;">
    </td>
  </tr>
  <tr>
    <td colspan="4" style="height:5px;background:#e94f35;font-size:0;line-height:0;">&nbsp;</td>
  </tr>
</table>
</body>
</html>
